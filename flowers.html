  <meta charset="UTF-8">

  <title>Congratulations, Ericka! 🌸</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {

      overflow: hidden;

      position: relative;

      font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #fff7fb 35%,
          #ffeaf3 70%,
          #ffd9e8 100%
        );

    }


    /* =================================
       SOFT BACKGROUND GLOW
    ================================= */

    .glow {

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        rgba(255, 160, 200, 0.22);

      filter: blur(70px);

      animation:
        glow 6s ease-in-out infinite;

      pointer-events: none;

    }

    .glow1 {
      left: -100px;
      top: -100px;
    }

    .glow2 {
      right: -100px;
      bottom: -100px;

      animation-delay: 3s;
    }

    @keyframes glow {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.4);
      }

    }


    /* =================================
       CENTER MESSAGE
    ================================= */

    .message {

      position: absolute;

      z-index: 100;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      width: min(88%, 600px);

      padding: 35px 25px;

      text-align: center;

      border-radius: 30px;

      background:
        rgba(255, 255, 255, 0.88);

      border:
        2px solid
        rgba(255, 190, 215, 0.8);

      box-shadow:
        0 20px 60px
        rgba(190, 100, 140, 0.18);

      backdrop-filter:
        blur(10px);

      animation:
        appear 1.5s ease forwards;

    }


    @keyframes appear {

      from {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(.7);

      }

      to {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);

      }

    }


    .message h1 {

      color: #d66f99;

      font-size:
        clamp(27px, 7vw, 48px);

      line-height: 1.2;

      margin-bottom: 18px;

    }


    .message p {

      color: #8f6878;

      font-size:
        clamp(15px, 4vw, 19px);

      line-height: 1.7;

    }


    .main-heart {

      display: block;

      margin-top: 20px;

      font-size: 50px;

      color: #e77da7;

      animation:
        heartbeat 1.4s ease-in-out infinite;

    }


    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

    }


    /* =================================
       FALLING OBJECTS
    ================================= */

    .falling {

      position: absolute;

      top: -80px;

      z-index: 10;

      pointer-events: none;

      user-select: none;

      animation:
        fall var(--duration)
        linear infinite;

      animation-delay:
        var(--delay);

    }


    @keyframes fall {

      0% {

        transform:
          translateY(-80px)
          translateX(0)
          rotate(0deg)
          scale(var(--size));

        opacity: 0;

      }

      8% {

        opacity: 1;

      }

      25% {

        transform:
          translateY(25vh)
          translateX(30px)
          rotate(90deg)
          scale(var(--size));

      }

      50% {

        transform:
          translateY(50vh)
          translateX(-35px)
          rotate(180deg)
          scale(var(--size));

      }

      75% {

        transform:
          translateY(75vh)
          translateX(35px)
          rotate(270deg)
          scale(var(--size));

      }

      92% {

        opacity: 1;

      }

      100% {

        transform:
          translateY(115vh)
          translateX(-20px)
          rotate(360deg)
          scale(var(--size));

        opacity: 0;

      }

    }


    /* =================================
       PINK FLOWERS
    ================================= */

    .pink-flower {

      color: #ed79aa;

      filter:
        drop-shadow(
          0 3px 5px
          rgba(220, 100, 150, .15)
        );

    }


    /* =================================
       WHITE FLOWERS
    ================================= */

    .white-flower {

      color: #ffffff;

      filter:
        drop-shadow(
          0 2px 5px
          rgba(160, 120, 140, .25)
        );

    }


    /* =================================
       HEARTS
    ================================= */

    .pink-heart {

      color: #ed78a7;

      text-shadow:
        0 2px 8px
        rgba(230, 100, 150, .25);

    }


    .white-heart {

      color: #ffffff;

      text-shadow:
        0 2px 8px
        rgba(150, 120, 140, .3);

    }


    /* =================================
       DIFFERENT SIZES
    ================================= */

    .small {
      font-size: 20px;
    }

    .medium {
      font-size: 32px;
    }

    .large {
      font-size: 45px;
    }

    .huge {
      font-size: 58px;
    }


    /* =================================
       MOBILE
    ================================= */

      .message {

        width: 82%;

        padding:
          28px 18px;

      }

      .message h1 {

        font-size: 28px;

      }

      .message p {

      }

      .main-heart {

        font-size: 42px;

      }

    }

  </style>
