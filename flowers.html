  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* =====================================
       PAGE
    ===================================== */

    body {

      width: 100%;
      min-height: 100vh;

      overflow: hidden;

      position: relative;

      font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 50% 50%,
          #ffffff 0%,
          #fff7fb 35%,
          #ffeaf3 70%,
          #ffdce9 100%
        );

    }


    /* =====================================
       SOFT GLOW
    ===================================== */

    .glow {

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        rgba(255, 180, 210, 0.25);

      filter:
        blur(70px);

      pointer-events: none;

      animation:
        glowMove 8s ease-in-out infinite;

    }


    .glow1 {

      left: -100px;
      top: -80px;

    }


    .glow2 {

      right: -100px;
      bottom: -100px;

      animation-delay: 3s;

    }


    .glow3 {

      left: 40%;
      top: 35%;

      width: 220px;
      height: 220px;

      animation-delay: 5s;

    }


    @keyframes glowMove {

      0%,
      100% {

        transform:
          scale(1);

        opacity: .7;

      }

      50% {

        transform:
          scale(1.35);

        opacity: 1;

      }

    }


    /* =====================================
       FLOWER FIELD
    ===================================== */

    .garden {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

    }


    /* =====================================
       FLOWERS
    ===================================== */

    .flower {

      position: absolute;

      user-select: none;

      font-size: 45px;

      z-index: 3;

      animation:
        flowerFloat
        var(--speed)
        ease-in-out
        infinite;

      animation-delay:
        var(--delay);

      transform-origin:
        center bottom;

    }


    @keyframes flowerFloat {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(-5deg)
          scale(1);

      }

      50% {

        transform:
          translateY(-15px)
          rotate(5deg)
          scale(1.05);

      }

    }
